<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bike Loan Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 30px 15px;
        }

        .calculator {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            font-size: 17px;
            border: 1px solid #aaa;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        #result {
            margin-top: 25px;
        }

        .result-box {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .result-title {
            background: #222;
            color: white;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 12px 14px;
            border-bottom: 1px solid #ddd;
        }

        .row:last-child {
            border-bottom: none;
        }

        .months {
            font-weight: bold;
        }

        .emi {
            font-weight: bold;
        }

        .error {
            color: red;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="calculator">

    <h1>(Only 60% Down Payment)</h1>

    <label for="MBP">Enter Motor Bike Price</label>

    <input
        type="number"
        id="MBP"
        placeholder="Enter bike price"
        min="1"
    >

    <button onclick="calculateLoan()">
        Calculate
    </button>

    <div id="result"></div>

</div>


<script>

function calculateLoan() {

    // Get Bike Price
    let MBP = parseFloat(document.getElementById("MBP").value);

    // Check input
    if (isNaN(MBP) || MBP <= 0) {

        document.getElementById("result").innerHTML =
            '<p class="error">Please enter a valid bike price.</p>';

        return;
    }


    // =========================
    // SETTINGS
    // =========================

    let EX = 40;
    let IRR = 24;
    let OC = 2520;


    // =========================
    // DOWN PAYMENT
    // =========================

    let A = MBP * EX / 100;

    let DP = MBP - A;


    // =========================
    // COMMISSION
    // =========================

    let COM = MBP * 4 / 100;
    if (COM > 50000) {
            COM = 50000;
        }


    // =========================
    // INSURANCE
    // =========================

    let IN = 0;

    if (MBP >= 250000 && MBP <= 500000) {

        IN = 16800;

    } else if (MBP > 500000 && MBP <= 750000) {

        IN = 21100;

    } else if (MBP > 750000 && MBP <= 1000000) {

        IN = 25600;

    } else if (MBP > 1000000 && MBP <= 1250000) {

        IN = 28800;

    } else if (MBP > 1250000 && MBP <= 1500000) {

        IN = 31600;

    } else if (MBP > 1500000 && MBP <= 1750000) {

        IN = 36100;

    } else if (MBP > 1750000 && MBP <= 2000000) {

        IN = 38800;
    }


    // =========================
    // LOAN AMOUNT
    // =========================

    let LA = A + COM + IN + OC;


    // =========================
    // MONTHLY INTEREST
    // =========================

    let r = IRR / 12 / 100;


    // =========================
    // FORMAT MONEY
    // =========================

    function money(value) {

        return "Rs. " + value.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

    }


    // =========================
    // OUTPUT
    // =========================

    let output = "";

    output += `
        <div class="result-box">

            <div class="result-title">
                Loan Details
            </div>

            <div class="row">
                <span>Bike Price</span>
                <span>${money(MBP)}</span>
            </div>

            <div class="row">
                <span>Down Payment</span>
                <span>${money(DP)}</span>
            </div>

            <div class="result-title">
                Monthly Payment
            </div>
    `;


    // =========================
    // EMI 12 - 72 MONTHS
    // =========================

    for (let M = 12; M <= 72; M += 12) {

        let EMI =
            LA * r * Math.pow(1 + r, M)
            /
            (Math.pow(1 + r, M) - 1);


        output += `
            <div class="row">
                <span class="months">
                    ${M} Months
                </span>

                <span class="emi">
                    ${money(EMI)}
                </span>
            </div>
        `;
    }


    output += `
        </div>
    `;


    // Display result
    document.getElementById("result").innerHTML = output;

}

</script>

</body>
</html>
